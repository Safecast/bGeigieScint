# OpenOCD Recovery Configuration - Low Speed Connection
# For ATSAML21G18B via DAPLink/CMSIS-DAP
#
# This configuration uses a very low SWD clock speed for maximum reliability
# when connecting to a potentially unstable target.
#
# Usage: openocd -f openocd_recovery_slow.cfg

source [find interface/cmsis-dap.cfg]
transport select swd

# Set SWD clock to very low speed (100 kHz)
# This helps with:
# - Noisy connections
# - Long wires
# - Targets in low-power modes
adapter speed 100

source [find target/at91samdXX.cfg]

# Initialize and halt
init
reset init

# Perform chip erase
echo "Attempting chip erase via DSU at low speed..."

# DSU.CTRL = 0x41002000, set CE bit (bit 4)
mwb 0x41002000 0x10

echo "Waiting for chip erase to complete..."
sleep 100

echo "Chip erase sequence completed"
echo "You can now program the device"

shutdown
