# OpenOCD Recovery Configuration - Connect Under Reset
# For ATSAML21G18B via DAPLink/CMSIS-DAP
#
# This configuration connects to the target while holding it in reset,
# preventing problematic firmware from interfering with debug access.
#
# Usage: openocd -f openocd_recovery_reset.cfg

source [find interface/cmsis-dap.cfg]
transport select swd

# Set SWD clock to a low speed for more reliable connection
adapter speed 100

# Configure reset behavior
# srst_only: Use system reset (nRST pin) if available
# connect_assert_srst: Assert reset during connection
reset_config srst_only connect_assert_srst

source [find target/at91samdXX.cfg]

# After connection, halt the target immediately
init
reset halt

# Perform chip erase via DSU
# The DSU (Device Service Unit) provides chip erase functionality
# This uses the CRC (Chip Erase) bit in DSU.CTRL register
echo "Attempting chip erase via DSU..."

# DSU base address for SAML21: 0x41002000
# DSU.CTRL offset: 0x00
# DSU.STATUSA offset: 0x01
# DSU.STATUSB offset: 0x02

# Enable chip erase: Set CE bit (bit 4) in DSU.CTRL
# DSU.CTRL = 0x41002000
mwb 0x41002000 0x10

# Wait for erase to complete
# Poll DSU.STATUSB.DONE bit (bit 0)
echo "Waiting for chip erase to complete..."
sleep 100

# Verify erase completed
echo "Chip erase sequence completed"
echo "You can now program the device with: pio run -t upload"

shutdown
