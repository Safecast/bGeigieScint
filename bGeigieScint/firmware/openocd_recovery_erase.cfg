# OpenOCD Recovery Configuration - Chip Erase Only
# For ATSAML21G18B via DAPLink/CMSIS-DAP
#
# This configuration attempts a straightforward chip erase
# without special reset handling.
#
# Try this FIRST before more aggressive recovery methods.
#
# Usage: openocd -f openocd_recovery_erase.cfg

source [find interface/cmsis-dap.cfg]
transport select swd

# Medium-low speed for reliability
adapter speed 400

source [find target/at91samdXX.cfg]

# Initialize
init
reset init

# Attempt chip erase via at91samdXX target
# The at91samdXX.cfg includes chip erase command
echo "Attempting chip erase..."

# Method 1: Try built-in at91samd chip-erase command
at91samd chip-erase

# Method 2: If above fails, direct DSU access
# Uncomment these lines if chip-erase command fails:
# echo "Attempting direct DSU erase..."
# mwb 0x41002000 0x10
# sleep 100

echo "Chip erase completed"

shutdown
